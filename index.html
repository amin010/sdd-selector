<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SDD Selector</title>
  <style>
    :root {
      --bg: #f3efe4; --bg-wash: #e4efe6; --fg: #1a1814; --muted: #5c564c; --card: #fffdf8;
      --line: #ddd4c3; --accent: #1f5c45; --accent-fg: #f7f3ea; --brass: #8a5a12;
      --warn: #9a3412; --warn-bg: #fff1e4; --ok: #14532d; --ok-bg: #e5f6eb;
      --high: #9f1239; --high-bg: #fde8ee; --focus: #1f5c45; --deemph: #7a7368;
      --shadow: 0 1px 2px rgba(26, 24, 20, .05), 0 10px 28px rgba(26, 24, 20, .05);
      --status-h: 5.75rem;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101412; --bg-wash: #1a2c22; --fg: #f4f0e6; --muted: #b7b0a3; --card: #1a221d;
        --line: #314038; --accent: #e2b657; --accent-fg: #1a1408; --brass: #e4c88a;
        --warn: #fdba74; --warn-bg: #3a2414; --ok: #86efac; --ok-bg: #143024;
        --high: #fecdd3; --high-bg: #4a1524; --focus: #e4c88a; --deemph: #a39c90;
        --shadow: 0 1px 0 rgba(255, 255, 255, .04), 0 14px 36px rgba(0, 0, 0, .35);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-padding-top: var(--status-h); }
    body {
      font: 16px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(1100px 420px at 8% -8%, var(--bg-wash), transparent 62%),
        var(--bg);
    }
    h1, h2.section-title, .card.hero h2 {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      letter-spacing: -0.02em;
    }
    ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .skip-link {
      position: absolute; left: .5rem; top: .5rem; z-index: 10;
      background: var(--accent); color: var(--accent-fg); padding: .45rem .8rem; border-radius: 6px;
      clip: rect(0 0 0 0); clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden;
    }
    .skip-link:focus, .skip-link:focus-visible {
      clip: auto; clip-path: none; width: auto; height: auto; overflow: visible;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: .85rem 1.25rem 3rem; }
    .header-row {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
      gap: .2rem 1rem;
    }
    header { padding: .35rem 0 .15rem; }
    header h1 { font-size: 2rem; font-weight: 600; line-height: 1.1; margin: 0; }
    header #pack-identity {
      margin: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brass);
    }
    header #pack-blurb { margin: .45rem 0 0; max-width: 42rem; color: var(--muted); font-size: .95rem; }
    .status-bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
      gap: .4rem .85rem;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow);
      padding: .65rem .9rem; margin: .85rem 0 1.15rem;
      backdrop-filter: blur(10px);
    }
    .status-copy { flex: 1 1 14rem; min-width: 0; }
    .progress { margin: 0; font-size: .82rem; color: var(--muted); }
    #report-summary { margin: .1rem 0 0; font-weight: 650; }
    .status-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .copy-status { font-size: .85rem; color: var(--ok); min-height: 1.2em; }
    .layout { display: grid; gap: 1.25rem; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: 1fr 1fr; align-items: start; }
      #report {
        position: sticky; top: var(--status-h);
        max-height: calc(100vh - var(--status-h) - .5rem); overflow: auto;
      }
      .rank-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .link-warn { color: var(--warn); font-size: .85rem; margin: .2rem 0 0; flex-basis: 100%; }
    fieldset {
      border: 1px solid var(--line); background: var(--card); border-radius: 14px;
      box-shadow: var(--shadow);
      margin: 0 0 .75rem; padding: .65rem .95rem .8rem;
      scroll-margin-top: calc(var(--status-h) + .35rem);
    }
    fieldset.answered { border-left: 3px solid var(--ok); }
    fieldset.answered legend::before { content: "✓ "; color: var(--ok); }
    fieldset.report-only { background: transparent; border-style: dashed; }
    fieldset.report-only legend { font-weight: 550; color: var(--muted); }
    legend { font-weight: 650; font-size: .95rem; padding: 0 .3rem; }
    .help { color: var(--muted); font-size: .82rem; margin: .08rem 0 .4rem; }
    .why {
      color: var(--fg); font-size: .88rem; line-height: 1.45;
      margin: .15rem 0 .55rem; padding: .4rem .65rem .45rem;
      border-left: 3px solid var(--brass);
      background: color-mix(in srgb, var(--brass) 9%, transparent);
      border-radius: 0 8px 8px 0;
    }
    .why-label {
      display: block; font-size: .68rem; font-weight: 650; letter-spacing: .08em;
      text-transform: uppercase; color: var(--brass); margin-bottom: .12rem;
    }
    .err {
      color: var(--high); font-size: .85rem; font-weight: 650;
      background: var(--high-bg); padding: .35rem .5rem; border-radius: 4px;
      border-left: 3px solid var(--high);
    }
    label { display: block; margin: .15rem 0; }
    fieldset > label {
      display: flex; align-items: flex-start; gap: .4rem;
      min-height: 44px; margin: 0; padding: .3rem 0; cursor: pointer;
    }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
    input[type="number"], select, textarea {
      font: inherit; color: inherit;
      background: color-mix(in srgb, var(--bg) 55%, var(--card));
      border: 1px solid var(--line);
      border-radius: 8px; padding: .45rem .55rem; width: 100%; max-width: 28rem;
    }
    textarea { min-height: 4.5rem; max-width: 100%; }
    .record-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem .7rem;
    }
    .record-grid label { display: flex; flex-direction: column; gap: .15rem; min-width: 0; margin: 0; }
    .record-grid input { max-width: 100%; }
    .radio-row {
      display: flex; flex-wrap: wrap; gap: .2rem .85rem; margin: .2rem 0 .45rem;
    }
    .radio-row > .help { flex-basis: 100%; margin: 0 0 .1rem; }
    .radio-row label {
      display: flex; align-items: center; gap: .35rem;
      min-height: 44px; margin: 0; cursor: pointer;
    }
    .rank-row { display: grid; gap: .5rem; }
    .rank-row label { display: flex; flex-direction: column; gap: .15rem; margin: 0; min-width: 0; }
    .rank-row select { max-width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .row label { min-width: 8rem; }
    button {
      font: inherit; font-weight: 560; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); padding: .45rem .95rem; min-height: 44px;
    }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    button.quiet {
      background: transparent; border-color: transparent; color: var(--muted);
      text-decoration: underline; text-underline-offset: .18em; min-height: 44px;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .banner, .card {
      border: 1px solid var(--line); background: var(--card); border-radius: 14px;
      box-shadow: var(--shadow);
      padding: .8rem .95rem; margin: 0 0 .75rem;
    }
    .banner a { color: inherit; }
    .card.hero {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card) 46%);
    }
    .kicker {
      margin: 0 0 .2rem; font-size: .72rem; font-weight: 650; letter-spacing: .12em;
      text-transform: uppercase; color: var(--brass);
    }
    .card.hero h2 { font-size: 1.7rem; font-weight: 600; margin: 0 0 .45rem; }
    .runner-up { margin: 0 0 .7rem; font-size: .92rem; }
    .card.caution { border-width: 1px; border-left-width: 4px; }
    .card.caution.high { border-left-color: var(--high); background: var(--high-bg); color: var(--fg); }
    .card.caution.medium { border-left-color: var(--warn); background: var(--warn-bg); }
    .card.caution.positive { border-left-color: var(--ok); background: var(--ok-bg); }
    .card.included { opacity: .78; border-style: dashed; color: var(--deemph); }
    .badge {
      display: inline-block; font-size: .72rem; font-weight: 650; margin-right: .3rem;
      padding: .12rem .45rem; border-radius: 999px; border: 1px solid var(--line); background: var(--bg);
    }
    .badge.hard_gate { border-color: var(--high); }
    .badge.human_gate, .badge.agent_gate { border-color: var(--accent); }
    .muted { color: var(--muted); }
    .deemph { color: var(--deemph); }
    .secondary h2 { font-size: 1rem; color: var(--muted); }
    .table-wrap { overflow-x: auto; }
    .report-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin: .9rem 0 .2rem; }
    pre {
      overflow: auto; background: var(--bg); border: 1px solid var(--line);
      padding: .75rem; border-radius: 6px; font-size: .85rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: .35rem .4rem; }
    h2 { font-size: 1.05rem; margin: 1rem 0 .35rem; }
    h2.section-title { font-size: 1.45rem; font-weight: 600; margin: 1.5rem 0 .55rem; }
    code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .86em;
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      padding: .08em .35em; border-radius: 4px;
    }
    progress { accent-color: var(--accent); width: min(16rem, 100%); height: .55rem; }
    details.section-collapsible { margin: 1.15rem 0 .45rem; }
    details.section-collapsible > summary.section-title {
      font-size: 1.05rem; font-weight: 650; cursor: pointer; list-style: disclosure-closed;
    }
    details.section-collapsible[open] > summary.section-title { list-style: disclosure-open; }
    h3 { font-size: .95rem; margin: .15rem 0 .3rem; }
    .notice { background: var(--warn-bg); color: var(--warn); padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#report">Skip to recommendation</a>
  <div class="wrap">
    <header>
      <div class="header-row">
        <h1 id="pack-title">SDD Selector</h1>
        <p id="pack-identity" class="muted" hidden></p>
      </div>
      <p id="pack-blurb">Answer the Finance Tech diagnostic. A base framework, overlays, and cautions update as you type. Nothing leaves this page.</p>
    </header>
    <div id="selftest-banner" hidden class="notice" role="status"></div>
    <div id="schema-notice" hidden class="notice" role="status"></div>
    <div id="status-bar" class="status-bar">
      <div class="status-copy">
        <p id="progress" class="progress"></p>
        <p id="report-summary" class="report-summary" aria-live="polite"></p>
      </div>
      <div class="status-actions">
        <button type="button" class="primary js-copy-md" id="copy-md" disabled>Copy as Markdown</button>
        <button type="button" class="js-copy-link" id="copy-link" disabled>Copy link</button>
        <button type="button" class="quiet" id="reset-btn">Reset</button>
        <span id="copy-status" class="copy-status" aria-live="polite"></span>
      </div>
      <p id="link-warn" class="link-warn" hidden></p>
    </div>
    <div class="layout">
      <form id="qform"></form>
      <div id="report">
        <div id="report-body"></div>
      </div>
    </div>
  </div>
<script>
(function () {
  "use strict";


  /* BEGIN EXPR */
  var MAX_DEPTH = 32;
  var MAX_NODES = 10_000;

  var OPERATORS = new Set([
    "answer", "derived", "result", "flag", "rank",
    "all", "any", "not",
    "eq", "ne", "gt", "gte", "lt", "lte",
    "in", "hasAny", "hasAll", "hasNone", "isSet", "rankAtMost",
    "add", "sub", "mul", "min", "max", "sumFields", "count",
    "countSelected", "bucket", "coalesce",
  ]);

  function isOperator(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    var keys = Object.keys(value);
    return keys.length === 1 && OPERATORS.has(keys[0]);
  }

  function depthOf(value, seen = new WeakSet()) {
    if (!value || typeof value !== "object") return 1;
    if (seen.has(value)) return Infinity;
    seen.add(value);
    var children = Array.isArray(value)
      ? value
      : Object.keys(value).map((key) => value[key]);
    var depth = 1;
    for (var child of children) depth = Math.max(depth, 1 + depthOf(child, seen));
    seen.delete(value);
    return depth;
  }

  function own(obj, key) {
    return obj != null && Object.prototype.hasOwnProperty.call(obj, key);
  }

  function isFiniteNumber(value) {
    return typeof value === "number" && Number.isFinite(value);
  }

  function recordValid(value, constraints = {}) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    var required = Array.isArray(constraints.requiredKeys)
      ? constraints.requiredKeys
      : [];
    for (var key of required) {
      if (!own(value, key)) return false;
      var item = value[key];
      if (!(isFiniteNumber(item) || (typeof item === "string" && item.length > 0))) {
        return false;
      }
      if (constraints.minimums && own(constraints.minimums, key) &&
          (!isFiniteNumber(item) || item < constraints.minimums[key])) {
        return false;
      }
      if (constraints.allowedValues && own(constraints.allowedValues, key) &&
          (!Array.isArray(constraints.allowedValues[key]) ||
           constraints.allowedValues[key].indexOf(item) === -1)) {
        return false;
      }
    }
    if (own(constraints, "sumTo")) {
      if (!isFiniteNumber(constraints.sumTo) || required.length === 0) return false;
      var sum = 0;
      for (var key of required) {
        var item = value[key];
        if (!isFiniteNumber(item) || item < 0) return false;
        sum += item;
      }
      if (constraints.sumToMode === "normalize") return sum > 0;
      if (sum !== constraints.sumTo) return false;
    }
    return true;
  }

  /** Scale a sumTo record onto its target. Returns a new object, or the input if it cannot be scaled. */
  function normalizeRecord(value, constraints = {}) {
    if (!recordValid(value, { ...constraints, sumToMode: "normalize" })) return value;
    if (!own(constraints, "sumTo") || constraints.sumToMode !== "normalize") return value;
    var required = Array.isArray(constraints.requiredKeys) ? constraints.requiredKeys : [];
    var sum = 0;
    for (var key of required) sum += value[key];
    if (sum === constraints.sumTo) return value;
    var out = { ...value };
    for (var key of required) out[key] = value[key] * (constraints.sumTo / sum);
    return out;
  }

  /** Normalize every sumTo-mode record on an answer object using FIELD_INDEX metadata. */
  function normalizeAnswers(answers, fieldIndex) {
    if (!answers || typeof answers !== "object") return answers || {};
    var out = { ...answers };
    var index = fieldIndex || {};
    for (var id of Object.keys(index)) {
      var meta = index[id];
      if (!meta || meta.kind !== "record" || !meta.constraints) continue;
      if (meta.constraints.sumToMode !== "normalize") continue;
      if (out[id] == null) continue;
      out[id] = normalizeRecord(out[id], meta.constraints);
    }
    return out;
  }

  function readAnswer(path, ctx) {
    if (typeof path !== "string" || !path) return null;
    var parts = path.split(".");
    var root = parts[0];
    var answers = ctx.answers || {};
    if (!own(answers, root)) return null;
    var meta = (ctx.fieldIndex || {})[root];
    var value = answers[root];
    if (meta && meta.kind === "record" && !recordValid(value, meta.constraints || {})) {
      return null;
    }
    for (var i = 1; i < parts.length; i++) {
      if (!value || typeof value !== "object" || !own(value, parts[i])) return null;
      value = value[parts[i]];
    }
    return value === undefined ? null : value;
  }

  function rankOf(field, value, ctx) {
    var ranked = readAnswer(field, ctx);
    if (!Array.isArray(ranked)) return null;
    var index = ranked.indexOf(value);
    return index === -1 ? null : index + 1;
  }

  function isSet(value) {
    if (value == null || value === "") return false;
    if (Array.isArray(value)) return value.length > 0;
    if (typeof value === "number") return Number.isFinite(value);
    return true;
  }

  function list(value) {
    return Array.isArray(value) ? value : null;
  }

  function numericArgs(raw, state, depth, minimum = 2) {
    if (!Array.isArray(raw) || raw.length < minimum) return null;
    var values = raw.map((item) => evalNode(item, state, depth + 1));
    return values.every(isFiniteNumber) ? values : null;
  }

  function ordered(raw, state, depth, compare) {
    var values = numericArgs(raw, state, depth, 2);
    return values && values.length === 2 ? compare(values[0], values[1]) : false;
  }

  function membership(raw, state, depth, mode) {
    if (!Array.isArray(raw) || raw.length !== 2) return false;
    var left = evalNode(raw[0], state, depth + 1);
    var right = evalNode(raw[1], state, depth + 1);
    if (left == null || !Array.isArray(right)) return false;
    if (mode === "in") return right.indexOf(left) !== -1;
    if (!Array.isArray(left)) return false;
    if (mode === "hasAny") return right.some((item) => left.indexOf(item) !== -1);
    if (mode === "hasAll") return right.every((item) => left.indexOf(item) !== -1);
    return !right.some((item) => left.indexOf(item) !== -1);
  }

  function evalNode(expr, state, depth) {
    state.nodes += 1;
    if (state.nodes > MAX_NODES || depth > MAX_DEPTH) throw state.limit;
    if (Array.isArray(expr)) return expr.map((item) => evalNode(item, state, depth + 1));
    if (!expr || typeof expr !== "object") return expr;

    var keys = Object.keys(expr);
    if (keys.length !== 1 || !OPERATORS.has(keys[0])) return false;
    var op = keys[0];
    var raw = expr[op];
    var ctx = state.ctx;

    if (op === "answer") return readAnswer(raw, ctx);
    if (op === "derived") return own(ctx.derived || {}, raw) ? ctx.derived[raw] : null;
    if (op === "result") return own(ctx.result || {}, raw) ? ctx.result[raw] : null;
    if (op === "flag") return !!(ctx.flags && ctx.flags[raw] === true);
    if (op === "rank") {
      return raw && typeof raw === "object" ? rankOf(raw.field, raw.of, ctx) : null;
    }
    if (op === "all" || op === "any") {
      if (!Array.isArray(raw)) return false;
      var values = raw.map((item) => evalNode(item, state, depth + 1));
      return op === "all" ? values.every(Boolean) : values.some(Boolean);
    }
    if (op === "not") {
      var value = evalNode(raw, state, depth + 1);
      return value == null ? false : !value;
    }
    if (op === "eq" || op === "ne") {
      if (!Array.isArray(raw) || raw.length !== 2) return false;
      var left = evalNode(raw[0], state, depth + 1);
      var right = evalNode(raw[1], state, depth + 1);
      if (left == null || right == null) return false;
      return op === "eq" ? left === right : left !== right;
    }
    if (op === "gt") return ordered(raw, state, depth, (a, b) => a > b);
    if (op === "gte") return ordered(raw, state, depth, (a, b) => a >= b);
    if (op === "lt") return ordered(raw, state, depth, (a, b) => a < b);
    if (op === "lte") return ordered(raw, state, depth, (a, b) => a <= b);
    if (op === "in" || op === "hasAny" || op === "hasAll" || op === "hasNone") {
      return membership(raw, state, depth, op);
    }
    if (op === "isSet") return isSet(evalNode(raw, state, depth + 1));
    if (op === "rankAtMost") {
      if (!raw || typeof raw !== "object" || !isFiniteNumber(raw.n)) return false;
      var rank = rankOf(raw.field, raw.of, ctx);
      return rank != null && rank <= raw.n;
    }
    if (["add", "sub", "mul", "min", "max"].indexOf(op) !== -1) {
      var values = numericArgs(raw, state, depth);
      if (!values) return null;
      if (op === "add") return values.reduce((a, b) => a + b, 0);
      if (op === "sub") return values.slice(1).reduce((a, b) => a - b, values[0]);
      if (op === "mul") return values.reduce((a, b) => a * b, 1);
      return op === "min" ? Math.min(...values) : Math.max(...values);
    }
    if (op === "sumFields") {
      if (!raw || typeof raw !== "object" || !Array.isArray(raw.keys)) return null;
      var values = raw.keys.map((key) => readAnswer(`${raw.field}.${key}`, ctx));
      return values.every(isFiniteNumber) ? values.reduce((a, b) => a + b, 0) : null;
    }
    if (op === "count") {
      var value = evalNode(raw, state, depth + 1);
      return Array.isArray(value) ? value.length : 0;
    }
    if (op === "countSelected") {
      if (!raw || typeof raw !== "object") return 0;
      var value = readAnswer(raw.field, ctx);
      if (value == null) return null;
      if (!Array.isArray(value)) return 0;
      var except = Array.isArray(raw.except) ? raw.except : [];
      return value.filter((item) => except.indexOf(item) === -1).length;
    }
    if (op === "bucket") {
      if (!raw || typeof raw !== "object") return null;
      var value = evalNode(raw.value, state, depth + 1);
      if (value == null) return null;
      if (!isFiniteNumber(value) || !Array.isArray(raw.cuts)) return raw.else ?? null;
      for (var cut of raw.cuts) {
        if (!cut || typeof cut !== "object") continue;
        if (own(cut, "lte") && value <= cut.lte) return cut.then;

 the split between frameworks that can revise a spec after work has started and frameworks that assume the spec stays still. High or interrupt-driven change needs a short path for small fixes. A stable roadmap can carry a heavier phased process.","fields":[{"kind":"single","id":"q6_volatility","hashKey":"q6","options":[{"value":"very_low","label":"Very low: locked down quarters in advance"},{"value":"moderate","label":"Moderate: goals clear for 2–4 weeks; occasional mid-sprint change"},{"value":"high","label":"High: shifting priorities every week"},{"value":"interrupt_driven","label":"Interrupt-driven: work arrives unpredictably in real time"}]}]},{"id":"q7_requirements","number":"Q7","section":"instrument","legend":"How granular and clear are requirements when they reach engineers?","help":"Structured stories favor Spec Kit; vague goals favor BMAD and reconnaissance.","why":"Structured stories can carry a phased spec workflow. A goal that is still a sentence needs a method that interviews and discovers the requirement before anyone writes code.","fields":[{"kind":"single","id":"q7_requirements","hashKey":"q7","options":[{"value":"structured","label":"Well-defined user stories with acceptance criteria and test cases"},{"value":"high_level","label":"High-level functional requirements needing discovery spikes"},{"value":"vague","label":"Vague business goals requiring heavy refinement"}]}]},{"id":"q8_compliance","number":"Q8","section":"instrument","legend":"What level of financial regulatory oversight applies?","help":"SOX Tier 1 boosts frameworks with enforced gates (Spec Kit, BMAD, Superpowers) and penalizes all-advisory stacks.","why":"A SOX Tier 1 team needs an audit trail and a gate that is more than a prompt the agent may ignore. Advisory-only stacks are called out for that tier, and a written constitution is added as a practice. Lighter compliance tiers need less of that.","fields":[{"kind":"single","id":"q8_compliance","hashKey":"q8","options":[{"value":"sox_tier1","label":"SOX-Critical / Tier 1"},{"value":"internal_governance","label":"Internal governance: high risk, not external SOX"},{"value":"standard_enterprise","label":"Standard enterprise security and data governance"},{"value":"low_nonfinancial","label":"Low / non-financial"}]}]},{"id":"q9_precision","number":"Q9","section":"instrument","legend":"Data accuracy and precision requirements","help":"Zero-tolerance boosts Superpowers and Spec Kit (enforced TDD / review gates) and penalizes advisory-only stacks.","why":"When a wrong number is a control failure, a checklist in the prompt is not a control. Zero tolerance raises the need for enforced tests and gates that actually block a bad change.","fields":[{"kind":"single","id":"q9_precision","hashKey":"q9","options":[{"value":"zero_tolerance","label":"Zero-tolerance for error (ledger-accurate, immutable audit logs)"},{"value":"analytics","label":"Near real-time analytical approximations"},{"value":"standard","label":"Standard operational data integrity"}]}]},{"id":"q10_architecture","number":"Q10","section":"instrument","legend":"Primary system architecture","help":"Monolith, hybrid, and batch data favor OpenSpec. Streaming is not treated as brownfield or as Spec Kit microservices.","why":"A monolith or a hybrid estate is a large existing system. The agent needs a tight boundary so it stays inside the change. A microservice estate is the lighter case. Streaming is scored on its own, closer to services than to a monolith.","fields":[{"kind":"single","id":"q10_architecture","hashKey":"q10","options":[{"value":"microservices","label":"Modern cloud-native microservices"},{"value":"batch_data","label":"Batch data pipelines"},{"value":"streaming","label":"Event-driven streaming"},{"value":"monolith","label":"Monolithic or legacy application"},{"value":"hybrid","label":"Hybrid (legacy backend with modern cloud wrapper)"}]}]},{"id":"q11","number":"Q11","section":"instrument","legend":"Deployment frequency and production lead time","help":"Cadence (with team size and autonomy) can select Superpowers or GSD Core. Cycle time is report-only.","why":"Shipping many times a day cannot absorb the same ceremony as a quarterly release. Cadence is how much process the recommendation is allowed to add. Time from commit to production is recorded in the report and does not change the score.","fields":[{"kind":"single","id":"q11_deploy_cadence","hashKey":"q11","label":"How often does your team release to production?","options":[{"value":"continuous","label":"Multiple times per day / on-demand"},{"value":"sprint","label":"Once or twice per sprint (every 1–2 weeks)"},{"value":"monthly","label":"Monthly"},{"value":"quarterly","label":"Quarterly or longer"}]},{"kind":"single","id":"q11_cycle_time","hashKey":"q11b","reportOnly":true,"label":"Average cycle time from code commit to running in production (report-only)","options":[{"value":"under_2h","label":"< 2 hours"},{"value":"1_3_days","label":"1–3 days"},{"value":"1_2_weeks","label":"1–2 weeks"},{"value":"over_2_weeks","label":"> 2 weeks"}]}]},{"id":"q12_quality_gates","number":"Q12","section":"instrument","legend":"Automated testing and quality gates (check all that run on every pull request)","help":"Coverage level is derived from how many automated gates you check. Manual-only is low coverage.","why":"The recommendation looks at how many automated checks already run on every pull request. Thin or manual-only coverage raises the need for a stronger verification practice. A team that already gates merges on tests needs less of that from the harness.","fields":[{"kind":"multi","id":"q12_quality_gates","hashKey":"q12","options":[{"value":"unit_coverage","label":"Unit tests with enforced coverage thresholds"},{"value":"integration_contract","label":"Integration / API contract tests"},{"value":"e2e","label":"Automated end-to-end regression tests"},{"value":"financial_reconciliation","label":"Automated financial data reconciliation tests"},{"value":"sast_dast","label":"Automated security and dependency scanning (SAST/DAST)"},{"value":"mostly_manual","label":"Mostly manual QA testing prior to release"}]}]},{"id":"q13_branching","number":"Q13","section":"profile","legend":"Source control and branching strategy","help":"Optional team profile. Shown in the Markdown report; does not change the recommendation.","why":"Branching strategy is part of the team profile in the Markdown report. It does not change which harness is recommended.","reportOnly":true,"fields":[{"kind":"single","id":"q13_branching","hashKey":"q13","options":[{"value":"trunk_based","label":"Trunk-based: short-lived branches merged to main"},{"value":"gitflow","label":"GitFlow / environment branching"},{"value":"adhoc","label":"Ad-hoc: no standardized convention"}]}]},{"id":"q14_release_autonomy","number":"Q14","section":"instrument","legend":"How dependent is your release cadence on external teams?","help":"Coupled or heavy internal dependence can add Spec Kitty practices. Vendor dependence is a caution, not that overlay.","why":"Releases that wait on other internal teams need a way to isolate concurrent work. Dependence on a vendor is a different problem: it is named as a caution, because the constraint sits outside the team's workflow.","fields":[{"kind":"single","id":"q14_release_autonomy","hashKey":"q14","options":[{"value":"autonomous","label":"Autonomous: build, test, and deploy independently"},{"value":"coupled","label":"Coupled releases with other finance tech services"},{"value":"heavy","label":"Heavy upstream/downstream dependencies"},{"value":"vendor","label":"Vendor dependent"}]}]},{"id":"q15_governance","number":"Q15","section":"instrument","legend":"Approval gates and governance","help":"Shapes overlays and cautions; does not pick the base framework by itself. CAB still adds a constitution overlay.","why":"A change-advisory board on every release raises the need for a written trail of what was approved and why. Peer review plus CI still matters, and it does not pick the harness on its own.","fields":[{"kind":"single","id":"q15_governance","hashKey":"q15","options":[{"value":"automated","label":"Fully automated via CI/CD policy compliance"},{"value":"lightweight_review","label":"Peer review (PR) + automated pipeline gates"},{"value":"cab","label":"CAB / Infosec / Architecture review required for every release"}]}]},{"id":"q16_bottlenecks","number":"Q16","section":"instrument","legend":"How severe is each productivity bottleneck?","help":"Independent severity ratings. No forced ranking. Feeds demand as a magnitude.","why":"Each problem is rated on its own, from none to blocking. Severity is how hard that problem pulls a practice: shifting requirements, fear of breaking calculations, waiting on other teams, and interrupt-driven support each ask for something different. Flaky builds, compliance paperwork, and legacy debt show up in the report next to the practice that addresses them.","fields":[{"kind":"record","id":"q16_bottlenecks","hashKey":"q16","fields":[{"kind":"single","id":"ambiguous_or_shifting","label":"Ambiguous or shifting requirements","options":[{"value":"none","label":"None"},{"value":"minor","label":"Minor"},{"value":"major","label":"Major"},{"value":"blocking","label":"Blocking"}]},{"kind":"single","id":"flaky_cicd","label":"Flaky CI/CD pipelines or slow builds","options":[{"value":"none","label":"None"},{"value":"minor","label":"Minor"},{"value":"major","label":"Major"},{"value":"blocking","label":"Blocking"}]},{"kind":"single","id":"cross_team_approvals","label":"Cross-team dependencies and waiting on approvals","options":[{"value":"none","label":"None"},{"value":"minor","label":"Minor"},{"value":"major","label":"Major"},{"value":"blocking","label":"Blocking"}]},{"kind":"single","id":"test_fear","label":"Lack of test automation / fear of breaking financial calculations","options":[{"value":"none","label":"None"},{"value":"minor","label":"Minor"},{"value":"major","label":"Major"},{"value"  rationed"}]}]},{"id":"q19_change_volume","number":"Q19","section":"constraints","legend":"Change volume profile","help":"Shapes overlays and cautions; does not pick the base framework by itself. Many-small still adds a documented fast path.","why":"A heavy process priced per change fails when the team ships many small changes. That raises the need for a short, low-ceremony path. A few large changes can carry more process.","fields":[{"kind":"single","id":"q19_change_volume","hashKey":"q19","options":[{"value":"many_small","label":"Many small changes"},{"value":"balanced","label":"Balanced mix"},{"value":"few_large","label":"Few large changes"}]}]},{"id":"q20_runtimes","number":"Q20","section":"constraints","legend":"Agent runtimes in use","help":"Hard veto: a framework that documents a non-empty runtime list with no overlap is excluded, not score-penalized. Choose Unsure / any if you do not know.","why":"A framework that documents which agents it supports, and lists none of yours, is removed before scoring. It cannot be voted back in by other signals. Choose Unsure if the runtime is not decided yet.","fields":[{"kind":"multi","id":"q20_runtimes","hashKey":"q20","options":[{"value":"claude_code","label":"Claude Code"},{"value":"cursor","label":"Cursor"},{"value":"codex","label":"Codex"},{"value":"copilot","label":"GitHub Copilot"},{"value":"gemini_cli","label":"Gemini CLI"},{"value":"windsurf","label":"Windsurf"},{"value":"opencode","label":"OpenCode"},{"value":"other","label":"Other"},{"value":"unsure","label":"Unsure / any runtime"}]}]},{"id":"q21_ci_maturity","number":"Q21","section":"constraints","legend":"Which CI artifacts already run on every pull request?","help":"Checklist of concrete artifacts. An ordinal maturity is derived, the same pattern as coverageLevel.","why":"Most of the gates in these frameworks are instructions to the agent, rather than checks that block a merge. What already runs in CI is the real backstop. No CI plus a high compliance bar is a       lines.push("### " + o.rule.label + (o.includedInBase ? " (included in base)" : "") + (watch ? " [watch]" : "") + prob);
      lines.push("Source: " + src);

  api.toMarkdown = toMarkdown;

  if (typeof window !== "undefined") window.SDDSelector = api;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function renderSingleInputs(container, field, name) {
    if (field.label) container.appendChild(el("p", { class: "help", text: field.label }));
    (field.options || []).forEach(function (o) {
      var id = name + "-" + o.value;
      var lab = el("label", { "for": id });
      lab.appendChild(el("input", { type: "radio", name: name, value: o.value, id: id }));
      lab.appendChild(document.createTextNode(" " + o.label));
      container.appendChild(lab);

  function renderMultiInputs(container, field) {
    (field.options || []).forEach(function (o) {
      var id = field.id + "-" + o.value;
      var lab = el("label", { "for": id });

  function renderNumberLabel(sub, hk) {
    var lab = el("label", { "for": hk + "-" + sub.id, text: sub.label || sub.id });
    var nattrs = { type: "number", name: hk + "_" + sub.id, id: hk + "-" + sub.id, step: "1" };
    if (sub.min != null) nattrs.min = String(sub.min);
    if (sub.max != null) nattrs.max = String(sub.max);
    lab.appendChild(el("input", nattrs));
    return lab;
  }

  function renderField(field, container) {
    if (field.kind === "single") {
      renderSingleInputs(container, field, field.id);
    } else if (field.kind === "multi") {
      renderMultiInputs(container, field);
    } else if (field.kind === "text") {
      var attrs = { name: field.id, id: field.id };
      if (field.maxLength != null) attrs.maxlength = String(field.maxLength);
      container.appendChild(el("textarea", attrs));
    } else if (field.kind === "ranked") {
      var wrap = el("div", { class: "rank-row" });
      var ranks = field.ranks || 3;
      var labels = field.rankLabels || [];
      for (var r = 1; r <= ranks; r++) {
        var rlab = labels[r - 1] || String(r);
        var lab = el("label", { "for": field.hashKey + "-" + r, text: rlab });
        var sel = el("select", { name: field.hashKey + "_" + r, id: field.hashKey + "-" + r });
        sel.appendChild(el("option", { value: "", text: "—" }));
        (field.options || []).forEach(function (o) {
          sel.appendChild(el("option", { value: o.value, text: o.label }));
        });
        lab.appendChild(sel);
        wrap.appendChild(lab);
      }
      container.appendChild(wrap);
    } else if (field.kind === "record") {
      var hk = field.hashKey || field.id;
      var grid = null;
      function flushGrid() {
        if (grid) { container.appendChild(grid); grid = null; }
      }
      (field.fields || []).forEach(function (sub) {
        if (sub.kind === "number") {
          if (!grid) grid = el("div", { class: "record-grid" });
          grid.appendChild(renderNumberLabel(sub, hk));
        } else if (sub.kind === "single") {
          flushGrid();
          var row = el("div", { class: "radio-row" });
          renderSingleInputs(row, sub, hk + "_" + sub.id);
          container.appendChild(row);
        } else {
          flushGrid();
        }
      });
      flushGrid();
      if (field.constraints && field.constraints.sumTo != null) {
        container.appendChild(el("p", { id: hk + "-sum", class: "help", text: "Sum: 0" }));
      }
    }
  }

  function renderQuestion(q) {
    var qid = q.id || "";
    var fs = el("fieldset", { id: "q-" + qid });
    if (q.reportOnly) fs.className = "report-only";
    fs.appendChild(el("legend", { text: (q.n || q.number || "") + ". " + q.legend }));
    var described = [];
    if (q.help) {
      var helpId = qid + "-help";
      fs.appendChild(el("p", { class: "help", id: helpId, text: q.help }));
      described.push(helpId);
    }
    if (q.why) {
      var whyId = qid + "-why";
      var why = el("p", { class: "why", id: whyId });
      why.appendChild(el("span", { class: "why-label", text: "Why this matters" }));
      why.appendChild(document.createTextNode(q.why));
      fs.appendChild(why);
      described.push(whyId);
    }
    if (described.length) fs.setAttribute("aria-describedby", described.join(" "));
    (q.fields || []).forEach(function (f) { renderField(f, fs); });
    return fs;

  function renderForm(questions, container) {
    container.innerHTML = "";
    var sections = (PACK.sections || []).slice();
    if (!sections.length) {
      questions.forEach(function (q) { container.appendChild(renderQuestion(q)); });
      return;
    }
    var buckets = {};
    sections.forEach(function (s) { buckets[s.id] = []; });
    var rest = [];
    questions.forEach(function (q) {
      if (q.section && buckets[q.section]) buckets[q.section].push(q);
      else rest.push(q);
    });
    sections.forEach(function (s) {
      var qs = buckets[s.id] || [];
      if (!qs.length) return;
      if (s.collapsed) {
        var det = el("details", { class: "section-collapsible" });
        det.appendChild(el("summary", { class: "section-title", text: s.title }));
        qs.forEach(function (q) { det.appendChild(renderQuestion(q)); });
        container.appendChild(det);
      } else {
        container.appendChild(el("h2", { class: "section-title", text: s.title }));
        qs.forEach(function (q) { container.appendChild(renderQuestion(q)); });
      }
    });
    rest.forEach(function (q) { container.appendChild(renderQuestion(q)); });
  }

  function readRecordFromForm(fd, meta) {
    var hk = meta.hashKey;
    var subs = meta.fields || [];
    var constraints = meta.constraints || {};
    if (constraints.sumTo != null) {
      var perc = subs.map(function (s) { return fd.get(hk + "_" + s.id); });
      if (!perc.some(function (x) { return x !== null && x !== ""; })) return undefined;
      var obj = {};
      subs.forEach(function (s, i) {
        obj[s.id] = perc[i] === "" || perc[i] == null ? NaN : +perc[i];
      });
      return obj;
    }
    var rec = {};
    var any = false;
    subs.forEach(function (s) {
      if (s.kind === "number") {
        var raw = fd.get(hk + "_" + s.id);
        var min = constraints.minimums && constraints.minimums[s.id];
        var primary = min != null && min > 0;
        if (primary) {
          if (raw !== null && raw !== "") any = true;
          rec[s.id] = raw === "" || raw == null ? undefined : +raw;
        } else {
          rec[s.id] = raw === "" || raw == null ? 0 : +raw;
        }
      } else if (s.kind === "single") {
        var sv = fd.get(hk + "_" + s.id);
        if (sv) { any = true; rec[s.id] = String(sv); }
      }
    });
    if (!any) return undefined;
    return rec;
  }

  function readAnswers(form) {
    var fd = new FormData(form);
    var a = {};
    ALL_FIELD_IDS.forEach(function (fid) {
      var meta = FIELD_INDEX[fid];
      if (meta.kind === "single") {
        var v = fd.get(fid);
        if (v) a[fid] = String(v);
      } else if (meta.kind === "multi") {
        var checks = fd.getAll(fid).map(String);
        if (checks.length) a[fid] = checks;
      } else if (meta.kind === "text") {
        var t = fd.get(fid);
        if (t) {
          var max = meta.maxLength != null ? meta.maxLength : String(t).length;
          a[fid] = String(t).slice(0, max);
        }
      } else if (meta.kind === "ranked") {
        var ranks = [];
        var n = meta.ranks || 3;
        for (var i = 1; i <= n; i++) {
          var rv = fd.get(meta.hashKey + "_" + i);
          if (rv) ranks.push(String(rv));
        }
        if (ranks.length) a[fid] = ranks;
      } else if (meta.kind === "record") {
        var rec = readRecordFromForm(fd, meta);
        if (rec !== undefined) a[fid] = rec;
      } else if (meta.kind === "number") {
        var raw = fd.get(fid);
        if (raw !== null && raw !== "") a[fid] = +raw;
      }
    });
    Object.keys(a).forEach(function (k) { if (a[k] === undefined) delete a[k]; });
    return SDDExpr.normalizeAnswers ? SDDExpr.normalizeAnswers(a, FIELD_INDEX) : a;
  }

  function applyAnswersToForm(form, answers) {
    function checkRadio(name, val) {
      if (!val) return;
      var n = form.querySelector('input[name="' + name + '"][value="' + CSS.escape(val) + '"]');
      if (n) n.checked = true;
    }
    ALL_FIELD_IDS.forEach(function (fid) {
      var meta = FIELD_INDEX[fid];
      var val = answers[fid];
      if (val == null) return;
      if (meta.kind === "single") {
        checkRadio(fid, val);
      } else if (meta.kind === "multi") {
        (val || []).forEach(function (v) {
          var n = form.querySelector("#" + CSS.escape(fid + "-" + v));
          if (n) n.checked = true;
        });
      } else if (meta.kind === "text") {
        var ta = form.querySelector("#" + CSS.escape(fid));
        if (ta) ta.value = val;
      } else if (meta.kind === "ranked") {
        (val || []).forEach(function (v, i) {
          var sel = form.querySelector("#" + meta.hashKey + "-" + (i + 1));
          if (sel) sel.value = v;
        });
      } else if (meta.kind === "record") {
        (meta.fields || []).forEach(function (sub) {
          if (sub.kind === "number") {
            var inp = form.querySelector("#" + meta.hashKey + "-" + sub.id);
            if (inp && val[sub.id] != null && isFinite(val[sub.id])) inp.value = val[sub.id];
          } else if (sub.kind === "single") {
            checkRadio(meta.hashKey + "_" + sub.id, val[sub.id]);
          }
        });
      }
    });
  }

  function preventRankDupes(form) {
    ALL_FIELD_IDS.forEach(function (fid) {
      var meta = FIELD_INDEX[fid];
      if (!meta || meta.kind !== "ranked" || !meta.unique) return;
      var n = meta.ranks || 3;
      var sels = [];
      for (var i = 1; i <= n; i++) sels.push(form.querySelector("#" + meta.hashKey + "-" + i));
      var chosen = sels.map(function (s) { return s && s.value; });
      sels.forEach(function (sel, idx) {
        if (!sel) return;
        Array.prototype.forEach.call(sel.options, function (opt) {
          if (!opt.value) { opt.disabled = false; return; }
          opt.disabled = chosen.some(function (v, j) { return v && v === opt.value && j !== idx; });
        });
      });
    });
  }

  function updateRecordSum(form) {
    ALL_FIELD_IDS.forEach(function (fid) {
      var meta = FIELD_INDEX[fid];
      if (!meta || meta.kind !== "record" || !meta.constraints || meta.constraints.sumTo == null) return;
      var sumEl = form.querySelector("#" + meta.hashKey + "-sum");
      if (!sumEl) return;
      var keys = meta.constraints.requiredKeys || (meta.fields || []).map(function (s) { return s.id; });
      var sum = 0;
      var filled = 0;
      keys.forEach(function (k) {
        var inp = form.querySelector("#" + meta.hashKey + "-" + k);
        if (inp && inp.value !== "") { sum += +inp.value; filled++; }
      });
      var target = meta.constraints.sumTo;
      var normalize = meta.constraints.sumToMode === "normalize";
      if (normalize) {
        sumEl.textContent = filled
          ? ("Sum: " + sum + (sum === target ? " ✓" : " (will be normalized to " + target + ")"))

  function progressCounts(answers) {

      for (var i = 0; i < fields.length; i++) {
        if (fieldPresent(answers, fields[i].id)) { answered += 1; break; }

  function summaryText(result, answers) {
    if (!result) return "Answer the questions to see a recommendation.";
    if (!hasRuleRelevantAnswer(answers) && !result.noRuntimeMatch) {
      return "Answer the questions to see a recommendation.";
    }
    if (result.noRuntimeMatch) {

        (result.closest || []).slice(0, 3).map(fwName).join(", ") + ".";

    if (result.selectionMode === "utility" && result.base) {

        ". " + nP + " practices, " + mC + " cautions.";

    if (result.insufficientSignal && !result.base) {
      return "Insufficient signal — no base rule scored high enough to recommend.";
    }
    if (result.insufficientSignal && result.base) {

        " (score " + (result.base.score != null ? result.base.score : "—") +
        ", margin " + result.margin + ").";
    }
    var name = fwName(resultBaseId(result));
    var n = (result.overlays || []).length;
    var m = (result.cautions || []).length;
    var high = 0;
    (result.cautions || []).forEach(function (cau) {
      var k = cau.rule && cau.rule.caution;
      if (k && k.kind !== "positive" && k.severity === "high") high += 1;
    });
    var extra = high ? ", " + high + " high" : "";
    return "Recommended base: " + name + ". " + n + " overlays, " + m + " cautions" + extra + ".";
  }

  function updateSummary(result, answers) {
    var elSum = typeof document !== "undefined" && document.getElementById("report-summary");

    var elProg = typeof document !== "undefined" && document.getElementById("progress");

    return "<span class=\"" + cls + "\">" + escHtml(label) + "</span>";
  }

  function reportActionsHtml() {
    return '<div class="report-actions">' +
      '<button type="button" class="primary js-copy-md">Copy as Markdown</button>' +
      '<button type="button" class="js-copy-link">Copy link</button></div>';
  }

  function buildReportHtml(result, answers, extra) {
    extra = extra || {};
    answers = answers || {};
    var html = [];
    if (extra.schemaNotice) html.push('<div class="notice">' + escHtml(extra.schemaNotice) + "</div>");
    if (extra.truncated) {
      var noteMeta = FIELD_INDEX[(REPORT_CFG.freeTextFields || [])[0]];
      var maxLen = (noteMeta && noteMeta.maxLength) || 500;
      html.push('<div class="notice">The process-mismatch note was truncated to ' + maxLen + ' characters in the link.</div>');
    }

    if (!shouldShowRecommendation(result, answers)) {
      html.push('<div class="card orientation"><h2>Your recommendation will appear here</h2>');
      html.push("<p>Answer a question the engine reads — not just the report-only ones — and a base framework, overlays, and cautions will update as you type.</p></div>");
      return html.join("");
    }

    var c = result.completeness;
    if (c.couldChangeResult.length) {
      html.push('<p class="banner">Unanswered that could change this result: ' +
        c.couldChangeResult.map(function (id) {
          return '<a href="' + escHtml(questionHref(id)) + '">' + escHtml(questionLabel(id)) + "</a>";
        }).join(", ") + "</p>");
    }

    if (result.noRuntimeMatch) {
      html.push('<div class="card caution high"><h2>No matching runtime</h2><p>No framework documents support for your runtimes. Closest: ' +
        escHtml((result.closest || []).map(fwName).join(", ")) +
        ". This is not a default recommendation — none of the catalogued frameworks list the runtimes you selected.</p></div>");
    } else if (result.exclusionSentence && result.noRuntimeMatch) {
      html.push('<div class="card caution high"><h2>No matching runtime</h2><p>' +
        escHtml(result.exclusionSentence) + " Closest: " +
        escHtml((result.closest || []).map(fwName).join(", ")) + ".</p></div>");
    } else if (result.insufficientSignal && !result.base) {
      html.push('<div class="card caution medium"><h2>Insufficient signal</h2>');
      html.push("<p>No base rule scored high enough to recommend a framework. The two closest options:</p><ul>");
      (result.ranking || []).slice(0, 2).forEach(function (row) {
        html.push("<li>" + escHtml(fwName(row.framework)) + " — score " + escHtml(String(row.score)) + "</li>");
      });
      if (!(result.ranking || []).length) {
        html.push("<li>None — answer more of the instrument so a rule can fire.</li>");
      }
      html.push("</ul></div>");
    } else if (result.base) {
      var bid = resultBaseId(result);
      var fw = FRAMEWORKS[bid];
      html.push('<div class="card hero"><p class="kicker">' +
        (result.insufficientSignal ? "Closest option (low confidence)" :
          (result.selectionMode === "utility" ? "Recommended harness" : "Recommended base")) +
        "</p><h2>" + escHtml(fw.name) + "</h2>");
      if (result.base.fallback) html.push("<p><strong>Default recommendation — no strong signal.</strong></p>");
      if (result.insufficientSignal) {
        html.push("<p><strong>Insufficient signal</strong> — score " +
          escHtml(String(result.base.score)) + ", margin " + escHtml(String(result.margin)) +
          ". Treat this as the closer of two options, not a diagnosis.</p>");
      } else if (result.selectionMode === "utility") {
        var acc = result.base.acceptability != null ? Math.round(result.base.acceptability * 100) + "%" : "—";
        var setLabel = (result.conformal || []).map(fwName).join(", ") || "—";
        html.push("<p>Acceptability <strong>" + escHtml(acc) + "</strong> · conformal set: " +
          escHtml(setLabel) + " · confidence " + escHtml(result.confidence || "—") + "</p>");
        if (result.exclusionSentence) {
          html.push("<p>" + escHtml(result.exclusionSentence) + "</p>");
        }
        if (result.contrib && Object.keys(result.contrib).length) {
          var axisRows = Object.keys(result.contrib).map(function (id) {
            var row = result.contrib[id] || {};
            return { id: id, demand: row.demand || 0, coverage: row.coverage || 0, unmet: row.unmet || 0 };
          }).filter(function (row) { return row.demand >= 0.25 || row.unmet >= 0.08; })
            .sort(function (a, b) { return b.unmet - a.unmet || b.demand - a.demand; })
            .slice(0, 5);
          if (axisRows.length) {
            html.push("<p>Axis contributions (exact; colour is not the only cue):</p><ul>");
            axisRows.forEach(function (row) {
              html.push("<li>" + escHtml(row.id) + " — demand " + row.demand.toFixed(2) +
                ", coverage " + row.coverage.toFixed(2) +
                ", unmet " + row.unmet.toFixed(2) + "</li>");
            });
            html.push("</ul>");
          }
        }
        if (result.counterfactuals && result.counterfactuals.length) {
          html.push("<p>If a single axis moved:</p><ul>");
          result.counterfactuals.forEach(function (row) {
            html.push("<li>" + escHtml(row.sentence) + "</li>");
          });
          html.push("</ul>");
        }
      } else if (result.base.score != null) {
        html.push("<p class=\"muted\">Score " + escHtml(String(result.base.score)) +
          " · margin " + escHtml(String(result.margin)) +
          " · confidence " + escHtml(result.confidence || "—") + "</p>");
      }
      html.push("<p>" + escHtml(result.base.rule.adopt.rationale) + "</p>");
      html.push("<p>Install: <code>" + escHtml(fw.install) + "</code></p>");
      html.push("<p>Because: " + escHtml(result.base.explanation.join("; ") || "—") + "</p>");
      html.push("<p>Enforcement:</p><ul>");
      fw.enforcement.forEach(function (e) {
        html.push("<li>" + badgeHtml(e.class, ENFORCEMENT_LABEL[e.class]) + " " + escHtml(e.practice) + " — " + escHtml(e.note) + "</li>");
      });
      html.push("</ul>");
      var ev = fw.evidence;
      html.push("<p>Evidence (" + escHtml(ev.verifiedOn) + "): " + ev.stars + " stars, commits/30d " + escHtml(ev.commitsLast30d) + ", " + escHtml(ev.latestRelease) +
        (result.evidenceAge.stale ? " <strong>Stale — verified more than " + SETTINGS.staleDays + " days before today.</strong>" : "") + "</p></div>");
    }

    if (result.runnerUp) {
      html.push('<p class="runner-up"><strong>Runner-up:</strong> ' + escHtml(fwName(result.runnerUp.rule.adopt.framework)) + " — " + escHtml(result.runnerUp.whyItLost) + "</p>");
    }

    html.push("<h2>Practice overlays</h2>");
    if (!result.overlays.length) html.push("<p class=\"muted\">None.</p>");
    result.overlays.forEach(function (o) {
      var cls = o.includedInBase ? "card included" : "card";
      var srcId = o.rule.adopt.framework;
      var watch = srcId && FRAMEWORKS[srcId] && FRAMEWORKS[srcId].status === "watch";
      var probLabel = o.probability != null ? Math.round(o.probability * 100) + "% inclusion" : "";
      html.push('<div class="' + cls + '"><h3>' + escHtml(o.rule.label) +
        (o.includedInBase ? ' <span class="badge">included in base</span>' : "") +
        (watch ? ' <span class="badge">watch</span>' : "") +
        (probLabel ? ' <span class="badge">' + escHtml(probLabel) + "</span>" : "") + "</h3>");
      if (probLabel) {
        html.push('<p><progress max="100" value="' + Math.round((o.probability || 0) * 100) +
          '" aria-label="' + escHtml(probLabel) + '">' + escHtml(probLabel) + "</progress> " +
          escHtml(probLabel) + "</p>");
      }
      html.push("<p>Source: " + escHtml(srcId ? fwName(srcId) : "native CI") + "</p>");
      html.push("<p>" + escHtml(o.rule.adopt.rationale) + "</p>");
      (o.notes || []).forEach(function (text) {
        html.push("<p>Note: " + escHtml(text) + "</p>");
      });
      var srcFw = srcId && FRAMEWORKS[srcId];
      if (srcFw) {
        html.push("<ul>");
        srcFw.enforcement.forEach(function (e) {
          html.push("<li>" + badgeHtml(e.class, ENFORCEMENT_LABEL[e.class]) + " " + escHtml(e.practice) + "</li>");
        });
        html.push("</ul>");
      } else {
        html.push("<p>" + badgeHtml("hard_gate", "Hard gate") + " Failing CI build.</p>");
      }
      html.push("</div>");
    });

    html.push("<h2>Cautions</h2>");
    if (!result.cautions.length) html.push("<p class=\"muted\">None.</p>");
    result.cautions.forEach(function (cau) {
      var k = cau.rule.caution;
      var kind = k.kind === "positive" ? "positive" : k.severity;
      var title = k.kind === "positive" ? "Positive note" : (k.severity === "high" ? "High" : "Medium");
      html.push('<div class="card caution ' + kind + '"><h3>' + escHtml(cau.rule.id) + " · " + title + "</h3>");
      html.push("<p>" + escHtml(k.finding) + "</p>");
      html.push("<p><strong>Mitigation:</strong> " + escHtml(k.mitigation) + "</p>");
      html.push("<p class=\"muted\">Source: " + escHtml(k.source) + "</p></div>");
    });

    html.push('<div class="secondary">');
    html.push("<h2>Bottleneck resolution</h2>");
    if (!result.bottleneckMatrix.length) html.push("<p class=\"muted\">Rate bottleneck severity to fill this matrix.</p>");
    else {
      html.push('<div class="table-wrap"><table><thead><tr><th>Severity</th><th>Bottleneck</th><th>Resolved by</th></tr></thead><tbody>');
      result.bottleneckMatrix.forEach(function (row) {
        var sev = row.severity || row.rank || "—";
        html.push("<tr><td>" + escHtml(String(sev)) + "</td><td>" + escHtml(optionLabel(bottleneckFieldId(), row.bottleneck)) + "</td><td>" +
          escHtml(row.resolvedBy ? row.resolvedBy.join(", ") : "Not addressed") + "</td></tr>");
      });
      html.push("</tbody></table></div>");
    }
    var unaddrHtml = unaddressedBottleneckIds();
    if (unaddrHtml.length) {
      html.push("<p class=\"muted\">Overlays in this revision do not address: " +
        escHtml(unaddrHtml.map(function (id) { return optionLabel(bottleneckFieldId(), id); }).join("; ")) +
        ".</p>");
    }

    html.push("<h2>Framework catalog</h2><ul>");
    Object.keys(FRAMEWORKS).forEach(function (id) {
      var fw = FRAMEWORKS[id];
      html.push("<li><strong>" + escHtml(fw.name) + "</strong> — " +
        escHtml(catalogRoleLabel(frameworkCatalogRole(id))) + "</li>");
    });
    html.push("</ul>");
    html.push("<h2>Suggested directory layout</h2><pre>" + escHtml((result.directoryLayout || []).join("\n")) + "</pre>");
    html.push("</div>");
    html.push(reportActionsHtml());
    return html.join("");
  }

  function renderReport(result, container, answers, extra) {
    var html = buildReportHtml(result, answers, extra);
    if (container) container.innerHTML = html;
    return html;
  }

  function bootUi() {
    var form = document.getElementById("qform");
    var reportBody = document.getElementById("report-body");
    var notice = document.getElementById("schema-notice");
    var linkWarn = document.getElementById("link-warn");
    var titleEl = document.getElementById("pack-title");
    var idEl = document.getElementById("pack-identity");
    if (titleEl && PACK_META.title) titleEl.textContent = PACK_META.title;
    if (idEl && PACK_META.id) {
      idEl.hidden = false;
      idEl.textContent = "Pack " + PACK_META.id + " v" + (PACK_META.version || "") +
        (PACK_META.updated ? " · updated " + PACK_META.updated : "");
    }
    if (typeof document !== "undefined" && PACK_META.title) document.title = PACK_META.title;
    renderForm(QUESTIONS, form);
    var extra = { schemaNotice: null, truncated: false };
    var hashTimer = null;

    var decoded = decodeHash(location.hash || "");
    if (decoded.notice) {
      extra.schemaNotice = decoded.notice;
      notice.hidden = false;
      notice.textContent = decoded.notice;
    }
    if (Object.keys(decoded.answers).length) applyAnswersToForm(form, decoded.answers);

    function scheduleHashUpdate(answers) {
      if (hashTimer) clearTimeout(hashTimer);
      hashTimer = setTimeout(function () {
        var enc = encodeHash(answers);
        if (history.replaceState) {
          history.replaceState(null, "", enc.hash ? "#" + enc.hash : location.pathname + location.search);
        }
      }, 300);
    }

    function syncStatusOffset() {
      var bar = document.getElementById("status-bar");
      if (!bar) return;
      document.documentElement.style.setProperty(
        "--status-h",
        Math.ceil(bar.getBoundingClientRect().height) + "px",
      );
    }

    function refresh(fromUser) {
      preventRankDupes(form);
      updateRecordSum(form);
      var answers = readAnswers(form);
      var result = evaluate(answers);
      var enc = encodeHash(answers);
      extra.truncated = enc.truncated;
      updateSummary(result, answers);
      markAnswered(form, answers);
      setCopyEnabled(shouldShowRecommendation(result, answers));
      renderReport(result, reportBody, answers, extra);
      syncStatusOffset();
      if (fromUser) scheduleHashUpdate(answers);
      api._last = { result: result, answers: answers, markdown: toMarkdown(result, answers), hash: enc.hash };
    }

    function flashCopied() {
      var node = document.getElementById("copy-status");
      if (!node) return;
      node.textContent = "Copied";
      if (flashCopied._t) clearTimeout(flashCopied._t);
      flashCopied._t = setTimeout(function () { node.textContent = ""; }, 1500);
    }

    function canCopy() {
      return !!(api._last && shouldShowRecommendation(api._last.result, api._last.answers));
    }

    function copyMarkdown() {
      if (!canCopy()) return;
      var md = api._last.markdown || "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(md).then(flashCopied).catch(function () { fallbackCopy(md); flashCopied(); });
      } else { fallbackCopy(md); flashCopied(); }
    }

    function copyShareLink() {
      if (!canCopy()) return;
      if (hashTimer) { clearTimeout(hashTimer); hashTimer = null; }
      var frag = (api._last && api._last.hash) ? api._last.hash : "";
      if (history.replaceState) {
        history.replaceState(null, "", frag ? "#" + frag : location.pathname + location.search);
      }
      if (linkWarn) {
        if (frag.length > 1800) {
          linkWarn.hidden = false;
          linkWarn.textContent = "This link is very long (~" + frag.length + " characters). Some chat clients may truncate it.";
        } else {
          linkWarn.hidden = true;
          linkWarn.textContent = "";
        }
      }
      var url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(flashCopied).catch(function () { fallbackCopy(url); flashCopied(); });
      } else { fallbackCopy(url); flashCopied(); }
    }

    form.addEventListener("input", function () { refresh(true); });
    form.addEventListener("change", function () { refresh(true); });
    window.addEventListener("resize", syncStatusOffset);
    document.getElementById("reset-btn").addEventListener("click", function () {
      var current = readAnswers(form);
      if (Object.keys(current).length && typeof confirm === "function" &&
          !confirm("Clear all answers? This cannot be undone with the back button.")) {
        return;
      }
      form.reset();
      extra.schemaNotice = null;
      extra.truncated = false;
      notice.hidden = true;
      if (linkWarn) { linkWarn.hidden = true; linkWarn.textContent = ""; }
      if (hashTimer) clearTimeout(hashTimer);
      if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
      refresh(false);
    });
    document.addEventListener("click", function (ev) {
      var t = ev.target && ev.target.closest && ev.target.closest("button");
      if (!t) return;
      if (t.classList.contains("js-copy-md") || t.id === "copy-md") {
        ev.preventDefault();
        copyMarkdown();
      } else if (t.classList.contains("js-copy-link") || t.id === "copy-link") {
        ev.preventDefault();
        copyShareLink();
      }
    });
    function fallbackCopy(text) {
      var ta = el("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    refresh(false);
  }

  api.frameworkCatalogRole = frameworkCatalogRole;
  api.catalogRoleLabel = catalogRoleLabel;
  api.candidateSet = candidateSet;
  api.selectBase = selectBase;
  api.hasRuleRelevantAnswer = hasRuleRelevantAnswer;
  api.shouldShowRecommendation = shouldShowRecommendation;
  api.summaryText = summaryText;
  api.updateSummary = updateSummary;
  api.buildReportHtml = buildReportHtml;
  api.renderReport = renderReport;
  api.isReportOnly = isReportOnly;
  api.questionLabel = questionLabel;
  api.progressText = progressText;
  api.progressCounts = progressCounts;

  if (typeof document !== "undefined") {
    var isSelf = typeof location !== "undefined" && /(?:^|[?&])selftest(?:&|$)/.test(location.search || "");
    document.addEventListener("DOMContentLoaded", function () {
      if (isSelf) {
        var r = runSelftest();
        var banner = document.getElementById("selftest-banner");
        if (banner) {
          banner.hidden = false;
          banner.textContent = r.ok
            ? "Selftest: ALL PASS (" + r.n + " checks)."
            : "Selftest FAIL (" + r.n + "): " + r.fails.join("; ");
          if (!r.ok) banner.className = "notice";
        }
        console.log(r.ok ? "ALL PASS" : r.fails);
      }
      bootUi();
    });
  }

  if (typeof module !== "undefined" && module.exports) module.exports = api;
})();
</script>
</body>
</html>
