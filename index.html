(function () {

    "in", "hasAny", "hasAll", "hasNone", "isSet", "rankAtMost",

    }

      return Array.isArray(value) ? value.length : 0;
    }
    if (op === "countSelected") {
      if (!raw || typeof raw !== "object") return 0;
      var value = readAnswer(raw.field, ctx);
      if (!Array.isArray(value) || value.length === 0) return 0;
      var except = Array.isArray(raw.except) ? raw.except : [];

    }

      if (!raw || typeof raw !== "object") return null;
      var value = evalNode(raw.value, state, depth + 1);
      if (value == null) return null;
      if (!isFiniteNumber(value) || !Array.isArray(raw.cuts)) return raw.else ?? null;

        if (own(cut, "lte") && value <= cut.lte) return cut.then;
        if (own(cut, "lt") && value < cut.lt) return cut.then;
        if (own(cut, "gte") && value >= cut.gte) return cut.then;
        if (own(cut, "gt") && value > cut.gt) return cut.then;

    }

      if (!Array.isArray(raw)) return null;
      for (var item of raw) {
        var value = evalNode(item, state, depth + 1);

  function readRecordFromForm(fd, meta) {
    var hk = meta.hashKey;
    var subs = meta.fields || [];
    var constraints = meta.constraints || {};
    if (constraints.sumTo != null) {
      var perc = subs.map(function (s) { return fd.get(hk + "_" + s.id); });
      if (!perc.some(function (x) { return x !== null && x !== ""; })) return undefined;
      var obj = {};

    var any = false;
    subs.forEach(function (s) {
      if (s.kind === "number") {

        var min = constraints.minimums && constraints.minimums[s.id];
        var primary = min != null && min > 0;
        if (primary) {

  function readAnswers(form) {

        var v = fd.get(fid);

      } else if (meta.kind === "multi") {
        var checks = fd.getAll(fid).map(String);

      } else if (meta.kind === "text") {
        var t = fd.get(fid);
        if (t) {
          var max = meta.maxLength != null ? meta.maxLength : String(t).length;
          a[fid] = String(t).slice(0, max);

      } else if (meta.kind === "ranked") {
        var ranks = [];
        var n = meta.ranks || 3;
        for (var i = 1; i <= n; i++) {
          var rv = fd.get(meta.hashKey + "_" + i);
          if (rv) ranks.push(String(rv));
        }
        if (ranks.length) a[fid] = ranks;
      } else if (meta.kind === "record") {
        var rec = readRecordFromForm(fd, meta);
        if (rec !== undefined) a[fid] = rec;
      } else if (meta.kind === "number") {
        var raw = fd.get(fid);

  function applyAnswersToForm(form, answers) {
    function checkRadio(name, val) {
      if (!val) return;

    ALL_FIELD_IDS.forEach(function (fid) {
      var meta = FIELD_INDEX[fid];
      var val = answers[fid];
      if (val == null) return;
      if (meta.kind === "single") {
        checkRadio(fid, val);
      } else if (meta.kind === "multi") {
        (val || []).forEach(function (v) {
          var n = form.querySelector("#" + CSS.escape(fid + "-" + v));

      } else if (meta.kind === "text") {
        var ta = form.querySelector("#" + CSS.escape(fid));
        if (ta) ta.value = val;
      } else if (meta.kind === "ranked") {
        (val || []).forEach(function (v, i) {
          var sel = form.querySelector("#" + meta.hashKey + "-" + (i + 1));

  function preventRankDupes(form) {

      var chosen = sels.map(function (s) { return s && s.value; });

        Array.prototype.forEach.call(sel.options, function (opt) {

        });

    });
  }

  function updateRecordSum(form) {

      var enc = encodeHash(answers);
      extra.truncated = enc.truncated;
      updateSummary(result, answers);
      renderReport(result, reportBody, answers, extra);

      if (hashTimer) { clearTimeout(hashTimer); hashTimer = null; }

      if (linkWarn) {
        if (frag.length > 1800) {
          linkWarn.hidden = false;

        } else {

    function fallbackCopy(text) {
      var ta = el("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    refresh(false);
  }

  api.hasRuleRelevantAnswer = hasRuleRelevantAnswer;
  api.shouldShowRecommendation = shouldShowRecommendation;
  api.summaryText = summaryText;
  api.updateSummary = updateSummary;
  api.buildReportHtml = buildReportHtml;
  api.renderReport = renderReport;
  api.isReportOnly = isReportOnly;

  if (typeof document !== "undefined") {
    var isSelf = typeof location !== "undefined" && /(?:^|[?&])selftest(?:&|$)/.test(location.search || "");
    document.addEventListener("DOMContentLoaded", function () {
      if (isSelf) {
        var r = runSelftest();
        var banner = document.getElementById("selftest-banner");
        if (banner) {
          banner.hidden = false;
          banner.textContent = r.ok
            ? "Selftest: ALL PASS (" + r.n + " checks)."
            : "Selftest FAIL (" + r.n + "): " + r.fails.join("; ");
          if (!r.ok) banner.className = "notice";
        }
        console.log(r.ok ? "ALL PASS" : r.fails);
      }
      bootUi();
    });
  }

  if (typeof module !== "undefined" && module.exports) module.exports = api;
})();
</script>
</body>
</html>
