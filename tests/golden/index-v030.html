<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SDD Selector</title>
  <style>
    :root {
      --bg: #f4f1ea; --fg: #1c1917; --muted: #57534e; --card: #fffcf7;
      --line: #d6d3d1; --accent: #1d4ed8; --accent-fg: #fff;
      --warn: #9a3412; --warn-bg: #ffedd5; --ok: #14532d; --ok-bg: #dcfce7;
      --high: #7f1d1d; --high-bg: #fee2e2; --focus: #1d4ed8; --deemph: #78716c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524;
        --line: #44403c; --accent: #93c5fd; --accent-fg: #1c1917;
        --warn: #fdba74; --warn-bg: #431407; --ok: #86efac; --ok-bg: #14532d;
        --high: #fecaca; --high-bg: #7f1d1d; --focus: #93c5fd; --deemph: #a8a29e;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 16px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg);
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
    header h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    header p { margin: 0 0 1rem; color: var(--muted); }
    .layout { display: grid; gap: 1.25rem; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: 1fr 1fr; align-items: start; }
      #report { position: sticky; top: .75rem; max-height: calc(100vh - 1.5rem); overflow: auto; }
    }
    fieldset {
      border: 1px solid var(--line); background: var(--card); border-radius: 8px;
      margin: 0 0 .85rem; padding: .75rem 1rem 1rem;
    }
    legend { font-weight: 650; padding: 0 .35rem; }
    .help { color: var(--muted); font-size: .9rem; margin: .15rem 0 .6rem; }
    .err { color: var(--high); font-size: .9rem; }
    label { display: block; margin: .2rem 0; }
    input[type="number"], select, textarea {
      font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
      border-radius: 4px; padding: .35rem .5rem; width: 100%; max-width: 28rem;
    }
    textarea { min-height: 4.5rem; max-width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .row label { min-width: 8rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
    button {
      font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
      background: var(--card); color: var(--fg); padding: .45rem .8rem;
    }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    .banner, .card {
      border: 2px solid var(--line); background: var(--card); border-radius: 8px;
      padding: .85rem 1rem; margin: 0 0 .85rem;
    }
    .card.caution { border-width: 2px; }
    .card.caution.high { border-color: var(--high); background: var(--high-bg); color: var(--fg); }
    .card.caution.medium { border-color: var(--warn); background: var(--warn-bg); }
    .card.caution.positive { border-color: var(--ok); background: var(--ok-bg); }
    .card.included { opacity: .92; border-style: dashed; }
    .badge { display: inline-block; font-size: .8rem; font-weight: 650; margin-right: .35rem; }
    .muted { color: var(--muted); }
    .deemph { color: var(--deemph); }
    pre {
      overflow: auto; background: var(--bg); border: 1px solid var(--line);
      padding: .75rem; border-radius: 6px; font-size: .85rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: .35rem .4rem; }
    h2 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
    h3 { font-size: 1rem; margin: .2rem 0 .35rem; }
    .notice { background: var(--warn-bg); color: var(--warn); padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SDD Selector</h1>
      <p>Answer the Finance Tech diagnostic. A base framework, overlays, and cautions update as you type. Nothing leaves this page.</p>
    </header>
    <div id="schema-notice" hidden class="notice" role="status"></div>
    <div class="actions">
      <button type="button" id="reset-btn">Reset</button>
      <button type="button" class="primary" id="copy-md">Copy as Markdown</button>
      <button type="button" id="copy-link">Copy link</button>
    </div>
    <div class="layout">
      <form id="qform"></form>
      <div id="report" aria-live="polite"></div>
    </div>
  </div>
<script>
(function () {
  "use strict";

  var SCHEMA_VERSION = 3;

  var STALE_DAYS = 180;
  var Q17_MAX = 500;
  var REPORT_ONLY = {
    q1_domain: 1, q4_tenure: 1, q11_cycle_time: 1, q13_branching: 1,

  };

  var ENFORCEMENT_LABEL = {

  var BOTTLENECK_LABEL = {

  var FRAMEWORKS = {
    openspec: {
      id: "openspec", name: "OpenSpec", repo: "Fission-AI/OpenSpec",
      status: "recommended",
      evidence: { verifiedOn: "2026-09-16", stars: 68430, forks: 4705, latestRelease: "v1.13.0 (2026-09-09)", commitsLast30d: 66, language: "TypeScript", license: "MIT" },
      runtimes: ["claude_code", "cursor", "codex", "copilot", "windsurf"],
      ceremony: 2, tokenCost: 2, brownfieldFit: 5, midFlightChange: 5,
      install: "openspec init (+ openspec config profile for expanded)",
      commands: ["/opsx:explore", "/opsx:propose", "/opsx:apply", "/opsx:update", "/opsx:sync", "/opsx:archive"],
      artifacts: ["openspec/specs/", "openspec/changes/<name>/{proposal,design,tasks,spec}.md"],
      enforcement: [
        { practice: "/opsx:verify (expanded profile)", class: "advisory", note: "Does not block archiving." },
        { practice: "Delta specs ADDED/MODIFIED/REMOVED", class: "human_gate", note: "Human archives." }
      ]
    },
    speckit: {
      id: "speckit", name: "GitHub Spec Kit", repo: "github/spec-kit",
      status: "recommended",
      evidence: { verifiedOn: "2026-09-16", stars: 137140, forks: 12280, latestRelease: "v1.0.7 (2026-09-15)", commitsLast30d: 100, language: "Python", license: "MIT" },
      runtimes: ["copilot", "claude_code", "gemini_cli"],
      ceremony: 4, tokenCost: 4, brownfieldFit: 2, midFlightChange: 2,

      commands: ["/speckit.constitution", "/speckit.specify", "/speckit.clarify", "/speckit.plan", "/speckit.analyze", "/speckit.tasks", "/speckit.implement"],

      enforcement: [

      ]
    },
    bmad: {
      id: "bmad", name: "BMAD Method", repo: "bmad-code-org/BMAD-METHOD",
      status: "recommended",
      evidence: { verifiedOn: "2026-09-16", stars: 53070, forks: 5994, latestRelease: "v6.12.0 (2026-09-04)", commitsLast30d: 100, language: "Python", license: "NOASSERTION" },
      runtimes: [],
      ceremony: 3, tokenCost: 4, brownfieldFit: 3, midFlightChange: 4,
      install: "/plugin marketplace add bmad-code-org/bmad-plugins",
      commands: ["bmad-prd", "bmad-architecture", "bmad-build", "bmad-correct-course", "bmad-quick-spec"],
      artifacts: ["_bmad/", "PRD.md", "ARCHITECTURE-SPINE.md", "tech-spec.md", "sprint-status.yaml"],
      enforcement: [
        { practice: "Python-backed sprint-status merge", class: "hard_gate", note: "Prevents state regression." },
        { practice: "Personas and phase gates", class: "human_gate", note: "Value depends on using the roles." }
      ]
    },
    gsd: {
      id: "gsd", name: "GSD Core", repo: "open-gsd/gsd-core",
      status: "viable",
      evidence: { verifiedOn: "2026-09-16", stars: 9501, forks: 685, latestRelease: "v1.14.0 (2026-09-14)", commitsLast30d: 100, language: "JavaScript", license: "MIT" },
      runtimes: ["claude_code", "opencode", "codex", "copilot", "cursor", "windsurf"],
      ceremony: 3, tokenCost: 3, brownfieldFit: 4, midFlightChange: 4,
      install: "npx @opengsd/gsd-core",
      commands: ["/gsd:discuss-phase", "/gsd:plan-phase", "/gsd:execute-phase", "/gsd:verify-work", "/gsd:ship", "/gsd:resume-work"],
      artifacts: [".planning/{PROJECT,REQUIREMENTS,ROADMAP,STATE}.md", ".planning/phases/", "HANDOFF.json"],
      enforcement: [
        { practice: "Plan-checker decision-coverage", class: "agent_gate", note: "Agent-executed check on plans." },
        { practice: "Verify vs shipped code", class: "agent_gate", note: "Stronger than constitution.md; weaker than CI." }
      ]
    },
    superpowers: {
      id: "superpowers", name: "Superpowers", repo: "obra/superpowers",
      status: "viable",
      evidence: { verifiedOn: "2026-09-16", stars: 287303, forks: 25690, latestRelease: "v6.3.0 (2026-08-12)", commitsLast30d: 0, language: "Shell", license: "MIT" },
      runtimes: ["claude_code", "codex", "gemini_cli", "cursor", "opencode", "copilot"],
      ceremony: 4, tokenCost: 5, brownfieldFit: 3, midFlightChange: 3,
      install: "/plugin install superpowers@claude-plugins-official",
      commands: ["brainstorming", "writing-plans", "test-driven-development", "subagent-driven-development", "requesting-code-review"],
      artifacts: ["design docs", "implementation plans", "git worktrees"],
      enforcement: [
        { practice: "TDD iron law", class: "agent_gate", note: "Production code before a failing test must be deleted." },
        { practice: "Brainstorming design approval", class: "human_gate", note: "Blocks implementation until a design is approved." }
      ]
    },
    speckitty: {
      id: "speckitty", name: "Spec Kitty", repo: "spec-kitty/spec-kitty",
      status: "viable",
      evidence: { verifiedOn: "2026-09-16", stars: 1627, forks: 166, latestRelease: "—", commitsLast30d: "unknown", language: "Python", license: "MIT" },
      runtimes: ["claude_code", "codex", "cursor", "gemini_cli", "copilot", "windsurf", "opencode"],
      ceremony: 4, tokenCost: 3, brownfieldFit: 3, midFlightChange: 3,
      install: "pip install spec-kitty-cli",
      commands: ["spec-kitty specify/plan/tasks", "spec-kitty agent action implement", "spec-kitty sync workspace"],
      artifacts: ["kitty-specs/", ".worktrees/", ".kittify/config.yaml", "append-only status log"],
      enforcement: [
        { practice: "27-transition lane machine", class: "hard_gate", note: "--force requires actor + reason." },
        { practice: "Decision Moments", class: "human_gate", note: "Human review to advance." }
      ]
    },
    tessl: {
      id: "tessl", name: "Tessl SDD Tile", repo: "tesslio/spec-driven-development-tile",
      status: "watch",
      evidence: { verifiedOn: "2026-09-16", stars: 53, forks: 8, latestRelease: "—", commitsLast30d: 0, language: "Shell", license: "MIT" },
      runtimes: [],
      ceremony: 3, tokenCost: 3, brownfieldFit: 2, midFlightChange: 2,
      install: "npx @tessl/cli install tessl-labs/spec-driven-development",
      commands: ["requirement-gathering", "spec-writer", "validate-specs.sh", "check-spec-links.sh"],
      artifacts: ["*.spec.md with [@test] links"],
      enforcement: [
        { practice: "[@test] link check", class: "advisory", note: "Verifies files exist; not that tests pass." },
        { practice: "Spec approval", class: "human_gate", note: "Human approves specs before code." }
      ]
    }
  };

  function opt(value, label) { return { value: value, label: label }; }

  var QUESTIONS = [
    { id: "q1_domain", n: "Q1", section: "instrument", type: "radio", reportOnly: true,
      legend: "What is your team's core functional domain?",
      help: "Shown in the report; does not change the recommendation.",
      options: [
        opt("ledger", "Core Financial Ledger / Accounting Engine"),
        opt("reporting_compliance", "Financial Reporting & Regulatory Compliance"),
        opt("treasury", "Treasury, Liquidity, or Capital Planning"),
        opt("data_pipeline", "Data Pipeline / Lakehouse / Financial Data Analytics"),
        opt("internal_platform", "Internal Platform / Shared Tooling / Infrastructure"),
        opt("other", "Other")
      ]},
    { id: "q2_team", n: "Q2", section: "instrument", type: "team",
      legend: "Team size and makeup (FTE)",
      help: "Total size and roles drive compact-team and BMAD routing. SWE and data-engineer counts are report-only." },
    { id: "q3_distribution", n: "Q3", section: "instrument", type: "radio",
      legend: "Geographic and time-zone distribution",
      help: "Global distribution with little overlap can trigger worktree / Decision Moment practices.",
      options: [
        opt("colocated", "Co-located in a single hub"),
        opt("regional", "Distributed across 1–2 compatible time zones"),
        opt("global_timezones", "Highly distributed globally with <3 hours daily overlap")
      ]},
    { id: "q4", n: "Q4", section: "instrument", type: "q4",
      legend: "Team tenure and domain experience",
      help: "Tenure is report-only. Low finance-domain familiarity can trigger domain reconnaissance." },
    { id: "q5_work_breakdown", n: "Q5", section: "instrument", type: "percents",
      legend: "Breakdown of incoming work (must total 100%)",
      help: "Non-roadmap share (ops + bugs + regulatory + tech debt) steers brownfield vs greenfield bases." },
    { id: "q6_volatility", n: "Q6", section: "instrument", type: "radio",
      legend: "How volatile are your business requirements?",
      help: "High or interrupt-driven volatility blocks Spec Kit and adds a low-ceremony fast path.",
      options: [
        opt("very_low", "Very low: locked down quarters in advance"),
        opt("moderate", "Moderate: goals clear for 2–4 weeks; occasional mid-sprint change"),
        opt("high", "High: shifting priorities every week"),
        opt("interrupt_driven", "Interrupt-driven: work arrives unpredictably in real time")
      ]},
    { id: "q7_requirements", n: "Q7", section: "instrument", type: "radio",
      legend: "How granular and clear are requirements when they reach engineers?",
      help: "Structured stories favor Spec Kit; vague goals favor BMAD and reconnaissance.",
      options: [
        opt("structured", "Well-defined user stories with acceptance criteria and test cases"),
        opt("high_level", "High-level functional requirements needing discovery spikes"),
        opt("vague", "Vague business goals requiring heavy refinement")
      ]},
    { id: "q8_compliance", n: "Q8", section: "instrument", type: "radio",
      legend: "What level of financial regulatory oversight applies?",
      help: "SOX Tier 1 (not internal governance) triggers a constitution overlay and enforcement cautions.",
      options: [
        opt("sox_tier1", "SOX-Critical / Tier 1"),
        opt("internal_governance", "Internal governance: high risk, not external SOX"),
        opt("standard_enterprise", "Standard enterprise security and data governance"),
        opt("low_nonfinancial", "Low / non-financial")
      ]},
    { id: "q9_precision", n: "Q9", section: "instrument", type: "radio",
      legend: "Data accuracy and precision requirements",
      help: "Zero-tolerance fires autonomous TDD and, with weak CI, a deterministic CI overlay.",
      options: [
        opt("zero_tolerance", "Zero-tolerance for error (ledger-accurate, immutable audit logs)"),
        opt("analytics", "Near real-time analytical approximations"),
        opt("standard", "Standard operational data integrity")
      ]},
    { id: "q10_architecture", n: "Q10", section: "instrument", type: "radio",
      legend: "Primary system architecture",
      help: "Monolith, hybrid, and batch data favor OpenSpec. Streaming is not treated as brownfield or as Spec Kit microservices.",
      options: [
        opt("microservices", "Modern cloud-native microservices"),
        opt("batch_data", "Batch data pipelines"),
        opt("streaming", "Event-driven streaming"),
        opt("monolith", "Monolithic or legacy application"),
        opt("hybrid", "Hybrid (legacy backend with modern cloud wrapper)")
      ]},
    { id: "q11", n: "Q11", section: "instrument", type: "q11",
      legend: "Deployment frequency and production lead time",
      help: "Cadence (with team size and autonomy) can select Superpowers or GSD Core. Cycle time is report-only." },
    { id: "q12_quality_gates", n: "Q12", section: "instrument", type: "checkbox",
      legend: "Automated testing and quality gates (check all that run on every pull request)",
      help: "Coverage level is derived from how many automated gates you check. Manual-only is low coverage.",
      options: [
        opt("unit_coverage", "Unit tests with enforced coverage thresholds"),
        opt("integration_contract", "Integration / API contract tests"),
        opt("e2e", "Automated end-to-end regression tests"),
        opt("financial_reconciliation", "Automated financial data reconciliation tests"),
        opt("sast_dast", "Automated security and dependency scanning (SAST/DAST)"),
        opt("mostly_manual", "Mostly manual QA testing prior to release")
      ]},
    { id: "q13_branching", n: "Q13", section: "instrument", type: "radio", reportOnly: true,
      legend: "Source control and branching strategy",
      help: "Shown in the report; does not change the recommendation.",
      options: [
        opt("trunk_based", "Trunk-based: short-lived branches merged to main"),
        opt("gitflow", "GitFlow / environment branching"),
        opt("adhoc", "Ad-hoc: no standardized convention")
      ]},
    { id: "q14_release_autonomy", n: "Q14", section: "instrument", type: "radio",
      legend: "How dependent is your release cadence on external teams?",
      help: "Coupled or heavy internal dependence can add Spec Kitty practices. Vendor dependence is a caution, not that overlay.",
      options: [
        opt("autonomous", "Autonomous: build, test, and deploy independently"),
        opt("coupled", "Coupled releases with other finance tech services"),
        opt("heavy", "Heavy upstream/downstream dependencies"),
        opt("vendor", "Vendor dependent")
      ]},
    { id: "q15_governance", n: "Q15", section: "instrument", type: "radio",
      legend: "Approval gates and governance",
      help: "CAB on every release triggers a regulatory constitution overlay.",
      options: [
        opt("automated", "Fully automated via CI/CD policy compliance"),
        opt("lightweight_review", "Peer review (PR) + automated pipeline gates"),
        opt("cab", "CAB / Infosec / Architecture review required for every release")
      ]},
    { id: "q16_bottlenecks", n: "Q16", section: "instrument", type: "ranked",
      legend: "Rank your team's top 3 productivity bottlenecks",
      help: "Rank 1 ambiguous-or-shifting fires reconnaissance. Test-fear in the top 2 fires TDD verification.",
      options: [
        opt("ambiguous_or_shifting", BOTTLENECK_LABEL.ambiguous_or_shifting),
        opt("flaky_cicd", BOTTLENECK_LABEL.flaky_cicd),
        opt("cross_team_approvals", BOTTLENECK_LABEL.cross_team_approvals),
        opt("test_fear", BOTTLENECK_LABEL.test_fear),
        opt("interruptive_support", BOTTLENECK_LABEL.interruptive_support),
        opt("compliance_overhead", BOTTLENECK_LABEL.compliance_overhead),
        opt("legacy_tech_debt", BOTTLENECK_LABEL.legacy_tech_debt)
      ]},
    { id: "q17_process_mismatch", n: "Q17", section: "instrument", type: "textarea", reportOnly: true,
      legend: "What currently feels mismatched about your development process or delivery cadence?",
      help: "Copied into the Markdown report. The engine never reads this text." },
    { id: "q18_token_budget", n: "Q18", section: "constraints", type: "radio",
      legend: "Token / plan budget",
      help: "Metered budgets avoid Superpowers as a base when coverage is low.",
      options: [
        opt("unmetered", "Unmetered"),
        opt("team_plan", "Team plan"),
        opt("individual_pro", "Individual Pro (metered)"),
        opt("strict", "Strict / rationed")
      ]},
    { id: "q19_change_volume", n: "Q19", section: "constraints", type: "radio",
      legend: "Change volume profile",
      help: "Many small changes add a documented fast path beside any heavyweight pipeline.",
      options: [
        opt("many_small", "Many small changes"),
        opt("balanced", "Balanced mix"),
        opt("few_large", "Few large changes")
      ]},
    { id: "q20_runtimes", n: "Q20", section: "constraints", type: "checkbox",
      legend: "Agent runtimes in use",
      help: "Frameworks that do not document at least one selected runtime are removed before base selection.",
      options: [
        opt("claude_code", "Claude Code"), opt("cursor", "Cursor"), opt("codex", "Codex"),
        opt("copilot", "GitHub Copilot"), opt("gemini_cli", "Gemini CLI"),
        opt("windsurf", "Windsurf"), opt("opencode", "OpenCode"), opt("other", "Other")
      ]},
    { id: "q21_ci_maturity", n: "Q21", section: "constraints", type: "radio",
      legend: "Existing CI enforcement maturity",
      help: "SOX or zero-tolerance with tests-only or no CI adds a deterministic CI overlay.",
      options: [
        opt("none", "None"),
        opt("tests_only", "Tests only"),
        opt("tests_plus_static", "Tests plus static analysis"),
        opt("contracts_runtime", "Contracts and runtime checks")
      ]}
  ];

  function q5Complete(q5) {
    if (!q5) return false;
    var keys = ["roadmap", "ops", "bugs", "regulatory", "tech_debt"];
    var sum = 0;
    for (var i = 0; i < keys.length; i++) {
      var n = q5[keys[i]];
      if (typeof n !== "number" || !isFinite(n) || n < 0) return false;
      sum += n;
    }
    return sum === 100;
  }

  function q2RulesComplete(t) {
    return !!(t && typeof t.total === "number" && t.total >= 1 &&
      typeof t.qa_sdet === "number" && t.qa_sdet >= 0 &&
      (t.product_owner === "dedicated" || t.product_owner === "shared" || t.product_owner === "none") &&
      (t.scrum_master === "dedicated" || t.scrum_master === "shared" || t.scrum_master === "none"));
  }

  function coverageLevel(gates) {
    var automated = (gates || []).filter(function (g) { return g !== "mostly_manual"; });
    if (automated.length === 0) return "low";
    if (automated.length <= 2) return "partial";
    return "high";
  }

  function derive(answers) {
    var a = answers || {};
    var d = {
      unplannedShare: null,
      nonRoadmapShare: null,
      volatilityIsHigh: a.q6_volatility === "high" || a.q6_volatility === "interrupt_driven",
      coverageLevel: coverageLevel(a.q12_quality_gates),
      hasRoles: null,
      teamSize: null
    };
    if (q5Complete(a.q5_work_breakdown)) {
      var q5 = a.q5_work_breakdown;
      d.unplannedShare = q5.ops + q5.bugs;
      d.nonRoadmapShare = q5.ops + q5.bugs + q5.regulatory + q5.tech_debt;
    }
    if (q2RulesComplete(a.q2_team)) {
      var t = a.q2_team;
      d.teamSize = t.total;

    html.push("<li>Cadence: " + esc(answers.q11_deploy_cadence || "—") + "; cycle time: " + esc(answers.q11_cycle_time || "—") + "</li>");
    html.push("<li>Branching: " + esc(answers.q13_branching || "—") + "</li></ul></div>");

    if (result.noRuntimeMatch) {
      html.push('<div class="card caution high"><h2>No matching runtime</h2><p>No framework documents support for your runtimes. Closest: ' +
        esc((result.closest || []).map(fwName).join(", ")) + ".</p></div>");
    } else if (result.base) {
      var bid = resultBaseId(result);
      var fw = FRAMEWORKS[bid];
      html.push('<div class="card"><h2>Recommended base: ' + esc(fw.name) + "</h2>");
      if (result.base.fallback) html.push("<p><strong>Default recommendation — no strong signal.</strong></p>");
      html.push("<p>" + esc(result.base.rule.adopt.rationale) + "</p>");
      html.push("<p>Install: <code>" + esc(fw.install) + "</code></p>");
      html.push("<p>Triggered by: " + esc(result.base.explanation.join("; ") || "—") + "</p>");
      html.push("<p>Enforcement:</p><ul>");
      fw.enforcement.forEach(function (e) {
        html.push("<li><span class=\"badge\">" + esc(ENFORCEMENT_LABEL[e.class]) + "</span> " + esc(e.practice) + " — " + esc(e.note) + "</li>");
      });
      html.push("</ul>");
      var ev = fw.evidence;
      html.push("<p>Evidence (" + esc(ev.verifiedOn) + "): " + ev.stars + " stars, commits/30d " + esc(ev.commitsLast30d) + ", " + esc(ev.latestRelease) +
        (result.evidenceAge.stale ? " <strong>Stale — verified more than 180 days before today.</strong>" : "") + "</p></div>");
    }

    if (result.runnerUp) {
      html.push('<div class="card"><h2>Runner-up</h2><p>' + esc(fwName(result.runnerUp.rule.adopt.framework)) + " — " + esc(result.runnerUp.whyItLost) + "</p></div>");
    }

    html.push("<h2>Practice overlays</h2>");
    if (!result.overlays.length) html.push("<p class=\"muted\">None.</p>");
    result.overlays.forEach(function (o) {
      var cls = o.includedInBase ? "card included" : "card";
      var srcId = o.rule.adopt.framework;
      var watch = srcId && FRAMEWORKS[srcId] && FRAMEWORKS[srcId].status === "watch";
      html.push('<div class="' + cls + '"><h3>' + esc(o.rule.label) +
        (o.includedInBase ? ' <span class="badge">included in base</span>' : "") +
        (watch ? ' <span class="badge">watch</span>' : "") + "</h3>");
      html.push("<p>Source: " + esc(srcId ? fwName(srcId) : "native CI") + "</p>");
      html.push("<p>" + esc(o.rule.adopt.rationale) + "</p>");
      if (o.reconciliationNote) {
        html.push("<p>Note: existing financial reconciliation tests are a related control already in place; TDD is a different control.</p>");
      }
      var srcFw = srcId && FRAMEWORKS[srcId];
      if (srcFw) {
        html.push("<ul>");
        srcFw.enforcement.forEach(function (e) {
          html.push("<li><span class=\"badge\">" + esc(ENFORCEMENT_LABEL[e.class]) + "</span> " + esc(e.practice) + "</li>");
        });
        html.push("</ul>");
      } else {
        html.push("<p><span class=\"badge\">Hard gate</span> Failing CI build.</p>");
      }
      html.push("</div>");
    });

    html.push("<h2>Cautions</h2>");
    if (!result.cautions.length) html.push("<p class=\"muted\">None.</p>");
    result.cautions.forEach(function (cau) {
      var k = cau.rule.caution;
      var kind = k.kind === "positive" ? "positive" : k.severity;
      var title = k.kind === "positive" ? "Positive note" : (k.severity === "high" ? "High" : "Medium");
      html.push('<div class="card caution ' + kind + '"><h3>' + esc(cau.rule.id) + " — " + title + "</h3>");
      html.push("<p>" + esc(k.finding) + "</p>");
      html.push("<p><strong>Mitigation:</strong> " + esc(k.mitigation) + "</p>");
      html.push("<p class=\"muted\">Source: " + esc(k.source) + "</p></div>");
    });

    html.push("<h2>Bottleneck resolution</h2>");
    if (!result.bottleneckMatrix.length) html.push("<p class=\"muted\">Rank three bottlenecks to fill this matrix.</p>");
    else {
      html.push("<table><thead><tr><th>Rank</th><th>Bottleneck</th><th>Resolved by</th></tr></thead><tbody>");
      result.bottleneckMatrix.forEach(function (row) {
        html.push("<tr><td>" + row.rank + "</td><td>" + esc(BOTTLENECK_LABEL[row.bottleneck]) + "</td><td>" +
          esc(row.resolvedBy ? row.resolvedBy.join(", ") : "Not addressed") + "</td></tr>");
      });
      html.push("</tbody></table>");
    }
    html.push("<p class=\"muted\">This revision has no overlay for interruptive support, compliance overhead, or legacy tech debt.</p>");

    if (answers.q17_process_mismatch) {
      html.push("<h2>Process mismatch note</h2><p>" + esc(answers.q17_process_mismatch) + "</p>");
    }
    html.push("<h2>Suggested directory layout</h2><pre>" + esc((result.directoryLayout || []).join("\n")) + "</pre>");
    container.innerHTML = html.join("");
  }

  function bootUi() {
    var form = document.getElementById("qform");
    var report = document.getElementById("report");
    var notice = document.getElementById("schema-notice");
    renderForm(QUESTIONS, form);
    var extra = { schemaNotice: null, truncated: false };

    var decoded = decodeHash(location.hash || "");
    if (decoded.notice) {
      extra.schemaNotice = decoded.notice;
      notice.hidden = false;
      notice.textContent = decoded.notice;
    }
    if (Object.keys(decoded.answers).length) applyAnswersToForm(form, decoded.answers);

    function refresh(fromUser) {
      preventRankDupes(form);
      updateQ5Sum(form);
      var answers = readAnswers(form);
      var result = evaluate(answers);
      var enc = encodeHash(answers);
      extra.truncated = enc.truncated;
      renderReport(result, report, answers, extra);
      if (fromUser && history.replaceState) {
        history.replaceState(null, "", enc.hash ? "#" + enc.hash : location.pathname + location.search);
      }
      api._last = { result: result, answers: answers, markdown: toMarkdown(result, answers) };
    }

    form.addEventListener("input", function () { refresh(true); });
    form.addEventListener("change", function () { refresh(true); });
    document.getElementById("reset-btn").addEventListener("click", function () {
      form.reset();
      extra.schemaNotice = null;
      extra.truncated = false;
      notice.hidden = true;
      if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
      refresh(false);
    });
    document.getElementById("copy-md").addEventListener("click", function () {
      var md = api._last ? api._last.markdown : "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(md).catch(function () { fallbackCopy(md); });
      } else fallbackCopy(md);
    });
    document.getElementById("copy-link").addEventListener("click", function () {
      var url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).catch(function () { fallbackCopy(url); });
      } else fallbackCopy(url);
    });
    function fallbackCopy(text) {
      var ta = el("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    refresh(false);
  }

  if (typeof document !== "undefined") {
    var isSelf = typeof location !== "undefined" && /(?:^|[?&])selftest(?:&|$)/.test(location.search || "");
    if (isSelf) {
      document.addEventListener("DOMContentLoaded", function () {
        var r = runSelftest();
        document.body.innerHTML = "<pre>" + (r.ok ? "ALL PASS" : "FAIL\n" + r.fails.join("\n")) + "</pre>";
        console.log(r.ok ? "ALL PASS" : r.fails);
      });
    } else {
      document.addEventListener("DOMContentLoaded", bootUi);
    }
  }

  if (typeof module !== "undefined" && module.exports) module.exports = api;
})();
</script>
</body>
</html>
